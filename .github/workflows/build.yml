name: build

# Builds one self-contained tree per platform, on that platform: the pinned
# python-build-standalone CPython (sha256 verified) with the hash-locked wheels
# of locks/<platform>.txt installed (every file checked against the lock,
# nothing compiled, nothing unlocked), plus a stub per tool. Then renders the
# npm packages, packs them once, and installs the packed tarballs on every
# platform's runner as a consumer would. When publishing, every tarball gets a
# build-provenance attestation, then the exact tested tarballs go to GitHub
# Packages (platform packages first, the launcher last; versions that already
# exist are skipped), then a GitHub release v<version> carries the tarballs,
# the corresponding source (the sdists of the GPL distributions, verified
# against PyPI, and build-scripts.tar.gz) and SHA256SUMS.
# Pull requests (this workflow called from pr.yml) build and test only.

on:
  push:
    branches: [main]
    paths: [upstream.json, locks/**, scripts/**, packages/**, test/**, .github/workflows/build.yml]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the packages and the release
        type: boolean
        default: true
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        type: string
        required: true
      publish:
        description: Publish the packages and the release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      package: ${{ steps.meta.outputs.package }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Metadata
        id: meta
        run: |
          {
            echo "version=$(bash scripts/pkgver.sh)"
            echo "package=$(jq -er .package upstream.json)"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: "Named test: a digest mismatch or an incomplete lock fails before anything is installed"
        run: bash test/digest-mismatch.sh

      - name: Fetch the corresponding source (GPL sdists, verified against PyPI)
        run: bash scripts/fetch-sources.sh build/source

      - uses: actions/upload-artifact@v7
        with:
          name: source
          path: build/source/*
          if-no-files-found: error

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-latest
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Tools
        run: command -v zstd >/dev/null || brew install zstd

      - name: Build the tree (pinned CPython plus hash-locked wheels)
        run: bash scripts/build.sh build/tree ${{ matrix.platform }}

      # Upload as one tarball: upload-artifact drops the executable bit.
      - name: Archive the tree
        run: tar -czf tree-${{ matrix.platform }}.tar.gz -C build/tree bin python LICENSES

      - uses: actions/upload-artifact@v7
        with:
          name: tree-${{ matrix.platform }}
          path: tree-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  pack:
    needs: [check, build]
    runs-on: ubuntu-24.04
    env:
      PKG: ${{ needs.check.outputs.package }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          pattern: tree-*
          merge-multiple: true
          path: build/trees

      - name: Stage packages
        run: |
          for platform in $(jq -r '.python.assets | keys | join(" ")' upstream.json); do
            mkdir -p "build/built/$platform"
            tar -xzf "build/trees/tree-$platform.tar.gz" -C "build/built/$platform"
          done
          bash scripts/stage.sh build/built build/npm

      - name: "Named tests: the launcher"
        run: LAUNCHER_DIR="$PWD/build/npm/$PKG" node --test test/launcher.test.js

      - name: Pack
        run: |
          mkdir -p dist/tgz
          for dir in build/npm/*/; do
            npm pack "./$dir" --pack-destination dist/tgz
          done
          ls -l dist/tgz

      - uses: actions/upload-artifact@v7
        with:
          name: npm
          path: dist/tgz/*.tgz
          if-no-files-found: error

  test:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-latest
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          name: npm
          path: dist/tgz

      - name: "Named test: install the packed tarballs and run the tools"
        run: bash scripts/smoke.sh dist/tgz ${{ matrix.platform }}

  publish:
    needs: [check, test]
    if: github.event_name != 'pull_request' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      PKG: ${{ needs.check.outputs.package }}
      SHA: ${{ needs.check.outputs.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@ai-swfactory-oss"

      - uses: actions/download-artifact@v8
        with:
          name: npm
          path: dist/tgz

      - uses: actions/download-artifact@v8
        with:
          name: source
          path: dist/source

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/tgz/*.tgz

      - name: Publish to GitHub Packages (platforms first, launcher last)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          publish() {
            local name=$1 file
            file="dist/tgz/$(echo "${name#@}" | tr / -)-$VERSION.tgz"
            if [ "$(npm view "$name@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "$name@$VERSION already published: skipping"
              return
            fi
            npm publish "$file" --tag latest
          }
          for platform in $(jq -r '.python.assets | keys | join(" ")' upstream.json); do
            publish "@ai-swfactory-oss/$PKG-$platform"
          done
          publish "@ai-swfactory-oss/$PKG"

      # The release is the corresponding source the NOTICE in every package
      # points at (GPL-3.0 section 6(d)). It must never be deleted while the
      # matching package version is served.
      - name: Create GitHub release v${{ needs.check.outputs.version }} with the corresponding source
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists: skipping"
            exit 0
          fi
          mkdir -p dist/release
          cp dist/tgz/*.tgz dist/source/* dist/release/
          tar -czf dist/release/build-scripts.tar.gz upstream.json locks scripts packages test .github LICENSE README.md
          (cd dist/release && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          {
            echo "\`$PKG\` as npm packages on GitHub Packages, package version \`$VERSION\`, on $(jq -r '"CPython \(.python.version) (python-build-standalone \(.python.build))"' upstream.json)."
            echo
            echo '```sh'
            echo "npm install --save-dev @ai-swfactory-oss/$PKG@$VERSION"
            echo '```'
            echo
            echo "Installed distributions per platform: see \`locks/<platform>.txt\` in \`build-scripts.tar.gz\` and the \`NOTICE\` of each platform package."
            echo
            echo "**Corresponding source (GPL-3.0-or-later):** the sdists attached here ($(ls dist/source | tr '\n' ' ')), each verified against the sha256 PyPI publishes, and \`build-scripts.tar.gz\`."
            echo
            echo "License: $(jq -r .license upstream.json). Assets: the npm tarballs as published, the corresponding source, and \`SHA256SUMS\` over all of them."
          } > dist/notes.md
          gh release create "$tag" dist/release/* --target "$SHA" --title "$tag" --notes-file dist/notes.md --latest
